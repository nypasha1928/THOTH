# Optional READ-ONLY testnet connection checks. This never enables exchange trading.
# docker compose -f compose.yaml -f compose.testnet.yaml up --build -d
services:
  app:
    environment:
      THOTH_BYBIT_TESTNET_KEY_FILE: /run/secrets/bybit_testnet_key
      THOTH_BYBIT_TESTNET_SECRET_FILE: /run/secrets/bybit_testnet_secret
    secrets:
      - bybit_testnet_key
      - bybit_testnet_secret
secrets:
  bybit_testnet_key:
    file: ${THOTH_BYBIT_TESTNET_KEY_PATH:?Set the private testnet key file path}
  bybit_testnet_secret:
    file: ${THOTH_BYBIT_TESTNET_SECRET_PATH:?Set the private testnet secret file path}
