name: THOTH checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js && node --check web/pages.js && node --check web/chart.js && node --check web/chart-ui.js && node --check web/login.js && node --check web/passkeys.js && node --check web/security-ui.js && node --check web/sw.js
      - run: python tools/port_indicator.py && git diff --exit-code -- thoth/indicator_core.py
      - run: bash -n deploy/install.sh
      - run: python tools/package_release.py /tmp/thoth-release.tar.gz
